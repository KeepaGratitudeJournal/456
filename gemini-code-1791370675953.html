<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>換個角度看生活 - 心情透視鏡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #F7FAFC;
      color: #2D3748;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px 18px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .title {
      font-size: 26px;
      font-weight: bold;
      color: #2C7A7B;
      text-align: center;
      margin: 6px 0 14px 0;
    }
    .guide-text {
      font-size: 19px;
      line-height: 1.6;
      color: #4A5568;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .tag-btn {
      background: #EDFDFD;
      border: 2px solid #B2F5EA;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 17px;
      line-height: 1.4;
      text-align: center;
      color: #234E52;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      transition: all 0.15s ease-in-out;
    }
    .tag-btn.active {
      background: #319795;
      color: #FFFFFF;
      border-color: #285E61;
      transform: scale(0.98);
    }
    .tag-btn span {
      font-size: 24px;
      margin-bottom: 4px;
    }
    textarea {
      width: 100%;
      height: 90px;
      font-size: 18px;
      padding: 12px;
      border: 2px solid #CBD5E0;
      border-radius: 14px;
      margin-bottom: 14px;
      resize: none;
      font-family: inherit;
    }
    .btn-submit {
      width: 100%;
      background: #319795;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 151, 149, 0.3);
    }
    .btn-submit:disabled { background: #A0AEC0; cursor: not-allowed; }
    .result-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: #FFFAF0;
      border: 2px solid #FEEBC8;
      display: none;
    }
    .result-title {
      font-size: 21px;
      font-weight: bold;
      color: #C05621;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-content {
      font-size: 20px;
      line-height: 1.7;
      color: #2D3748;
      margin-bottom: 14px;
    }
    .btn-speak {
      background: #ED8936;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }
    .btn-speak:active { background: #DD6B20; }
  </style>
</head>
<body>

<div class="container">
  <div class="title">👓 心情透視鏡</div>
  <div class="guide-text">
    點選一個最近讓您有點煩心或無奈的事，或在框框內自己寫：
  </div>

  <div class="quick-grid">
    <button class="tag-btn" onclick="selectTag(this, '家人講話口氣很急、很大聲，讓我心裡不舒服')">
      <span>🗣️</span>家人講話急又大聲
    </button>
    <button class="tag-btn" onclick="selectTag(this, '孫子孩子回家都一直看手機，很少跟我講話')">
      <span>📱</span>後輩回家一直滑手機
    </button>
    <button class="tag-btn" onclick="selectTag(this, '身體常常這裡酸那裡痛，覺得年紀大很不中用')">
      <span>🩹</span>身體常常酸痛不適
    </button>
    <button class="tag-btn" onclick="selectTag(this, '晚上常常翻來覆去睡不好，很早就醒過來')">
      <span>🌙</span>晚上容易失眠睡不好
    </button>
    <button class="tag-btn" onclick="selectTag(this, '常常轉頭就忘記東西放哪，擔心自己記性退化')">
      <span>🔑</span>常常忘東忘西找東西
    </button>
    <button class="tag-btn" onclick="selectTag(this, '天氣不好下大雨，只能整天關在家裡好無聊')">
      <span>🌧️</span>下雨天悶在家很無趣
    </button>
    <button class="tag-btn" onclick="selectTag(this, '鄰居或朋友講話酸言酸語，聽了心裡很不開心')">
      <span>💬</span>朋友鄰居講話不好聽
    </button>
    <button class="tag-btn" onclick="selectTag(this, '每天日子好像都差不多，感覺生活沒什麼特別目標')">
      <span>⏳</span>生活平淡沒什麼目標
    </button>
  </div>

  <textarea id="userInput" placeholder="也可以在此自己打字或用語音輸入自己的小事情..."></textarea>

  <button class="btn-submit" id="btnSubmit" onclick="getReframing()">請 AI 助教換角度看 ➔</button>

  <div class="result-box" id="resultBox">
    <div class="result-title">🌟 AI 助教的溫暖發現：</div>
    <div class="result-content" id="resultText"></div>
    <!-- 只有主動點擊按鈕才會發出聲音 -->
    <button class="btn-speak" onclick="speakResult()">🔊 唸給我聽</button>
  </div>
</div>

<script>
  const GEMINI_API_KEY = "AIzaSyBTKwJcy3EQkJTawHBpm-lc8x-lr-QDreU";

  function selectTag(element, text) {
    document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('userInput').value = text;
  }

  async function getReframing() {
    const input = document.getElementById('userInput').value.trim();
    if (!input) {
      alert("請先點選上方其中一個煩惱卡片，或自己在框框輸入喔！");
      return;
    }

    // 若前一次正在播放語音先停止
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }

    const btn = document.getElementById('btnSubmit');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    btn.disabled = true;
    btn.innerText = "助教正在用心換角度思考中...";
    resultBox.style.display = "none";

    const promptText = `
你是一位專為台灣社區長輩服務的溫暖「AI 數位助教」。
現在長輩分享了他最近感到煩惱或不開心的事情：「${input}」。

請依照以下原則進行「正向心理學認知轉念（Cognitive Reframing）」：
1. 稱呼「大哥/大姐」，語氣極度親切、溫暖、有同理心。
2. 先用一句話肯定並接納他的情緒（同理，不說教）。
3. 具體提供一個「換個角度看」的新觀點或正向詮釋（例如看到背後的關心、身體的辛勞、轉機或平靜）。
4. 結尾給予一句溫柔打氣或微小的正向提問。
5. 字數嚴格控制在 100~130 字以內，繁體中文，語句簡潔好讀，絕對不要使用列點或 markdown 符號。
`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
        resultText.innerText = data.candidates[0].content.parts[0].text.trim();
      } else {
        throw new Error(data.error ? data.error.message : "API 回傳格式不符");
      }
    } catch (err) {
      console.error("Gemini 呼叫失敗:", err);
      // 網路斷線或異常時的溫暖保底回覆
      resultText.innerText = `大哥/大姐，這件事確實會讓人心裡有些悶悶的。但換個角度看，事情已經發生了，而您今天願意打開心胸提出來覺察，代表您擁有一顆非常有智慧且願意轉念的心。試著想想看，這件事裡有沒有哪個微小的地方，是值得感謝或讓自己學到智慧的呢？`;
    } finally {
      resultBox.style.display = "block";
      btn.disabled = false;
      btn.innerText = "請 AI 助教換角度看 ➔";
      // 這裡不執行 speakResult()，保持純文字靜態呈現
    }
  }

  function speakResult() {
    const text = document.getElementById('resultText').innerText;
    if ('speechSynthesis' in window && text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.85; // 稍微放慢語速，適合長輩聆聽
      window.speechSynthesis.speak(utter);
    } else {
      alert("很抱歉，您的手機瀏覽器不支援自動朗讀語音。");
    }
  }
</script>
</body>
</html>
